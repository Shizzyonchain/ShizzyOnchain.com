services:
  - type: web
    name: shizzy-subtensor-api
    runtime: docker
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    plan: starter
    dockerCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /livez
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shizzy-subtensor-db
          property: connectionString
      - key: API_KEYS
        sync: false
      - key: PUBLIC_READS
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://shizzyunchained.com
      - key: SUBTENSOR_WS_URL
        value: wss://entrypoint-finney.opentensor.ai:443
      - key: SUBTENSOR_WS_FALLBACK_URLS
        value: wss://archive.chain.opentensor.ai:443
      - key: WALLET_RPC_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_PENDING_WALLET_JOBS
        value: "25"
      - key: WALLET_JOB_RETENTION_HOURS
        value: "24"

  - type: worker
    name: shizzy-subtensor-indexer
    runtime: docker
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    plan: starter
    dockerCommand: python -m app.indexer
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shizzy-subtensor-db
          property: connectionString
      - key: SUBTENSOR_WS_URL
        value: wss://entrypoint-finney.opentensor.ai:443
      - key: BACKFILL_WS_URL
        value: wss://archive.chain.opentensor.ai:443
      - key: SUBTENSOR_WS_FALLBACK_URLS
        value: wss://archive.chain.opentensor.ai:443
      - key: WALLET_RPC_TIMEOUT_SECONDS
        value: "30"
      - key: RPC_CONNECT_TIMEOUT_SECONDS
        value: "8"
      - key: WALLET_JOB_RETENTION_HOURS
        value: "24"
      - key: RPC_SUBSCRIBE_TIMEOUT_SECONDS
        value: "8"
      - key: RPC_HEAD_TIMEOUT_SECONDS
        value: "30"
      - key: RPC_BLOCK_TIMEOUT_SECONDS
        value: "45"
      - key: BACKFILL_PRICE_GAPS
        value: "true"
      - key: BACKFILL_SAMPLE_BLOCKS
        value: "5"
      - key: BACKFILL_CONCURRENCY
        value: "4"
      - key: INDEXER_START_BLOCK
        value: latest
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: shizzy-subtensor-db
    plan: basic-256mb
    databaseName: shizzy
    user: shizzy
