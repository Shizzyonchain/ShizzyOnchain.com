name: Validate Subnet News

on:
  pull_request:
    paths:
      - "app/subnet-news/**"
      - "app/lib/subnet-news.ts"
      - "content/subnet-news/**"
      - "scripts/publish-subnet-news.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "content/subnet-news/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:subnet-news
      - run: npm run lint
      - run: npm run build
