[project]
name = "shizzy-subtensor-pipeline"
version = "0.1.0"
description = "Block-pinned Bittensor subnet price and wallet data pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "asyncpg==0.31.0",
  "bittensor==11.1.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.3",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.16.3"]

[project.scripts]
shizzy-api = "app.api:run"
shizzy-indexer = "app.indexer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
