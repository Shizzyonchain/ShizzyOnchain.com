[project]
name = "shizzy-subtensor-pipeline"
version = "0.1.0"
description = "Block-pinned Bittensor subnet price and wallet data pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "bittensor>=11,<12",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
shizzy-api = "app.api:run"
shizzy-indexer = "app.indexer:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
